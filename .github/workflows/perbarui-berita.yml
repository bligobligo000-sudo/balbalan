# Mengambil berita terbaru setiap 3 jam, menyimpannya, lalu memasang ulang website.
name: Perbarui berita

on:
  schedule:
    - cron: "17 */3 * * *"   # setiap 3 jam (menit ke-17, jam UTC)
  workflow_dispatch:          # tombol "Run workflow" untuk update manual
  push:
    branches: [main]          # pasang ulang website kalau ada tulisan baru (Pages CMS) atau perubahan tampilan

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: perbarui-berita
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pasang.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ambil berita terbaru
        if: github.event_name != 'push'
        run: python scripts/ambil_berita.py

      - name: Ambil jadwal, hasil & klasemen
        if: github.event_name != 'push'
        continue-on-error: true   # kalau gagal, data lama tetap dipakai dan berita tetap terbit
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/ambil_liga.py

      - name: Simpan berita ke repositori
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data/berita.json site/data/liga.json
          if git diff --cached --quiet; then
            echo "Tidak ada data baru."
          else
            git commit -m "Perbarui berita $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --quiet
            git push
          fi

      - name: Buat semua halaman website
        run: |
          python -m pip install --quiet pyyaml
          python scripts/buat_situs.py

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: pasang
        uses: actions/deploy-pages@v5
